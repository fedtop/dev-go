name: 'Submit to Web Store'
# 手动运行，选择要提交的 tag（如 v0.1.0）；凭据配置见 docs/publishing.md
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and zip extension artifact
        run: pnpm zip
      # 产物名随 package.json 版本变化（dev-go-<version>-chrome.zip），不要写死
      - name: Resolve artifact path
        id: artifact
        run: echo "path=.output/dev-go-$(node -p "require('./package.json').version")-chrome.zip" >> "$GITHUB_OUTPUT"
      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: ${{ steps.artifact.outputs.path }}
          verbose: true
